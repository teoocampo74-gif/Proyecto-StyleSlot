<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleSlot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">StyleSlot</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">Administración</a>
        </div>
    </nav>
    <main class="container">
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
        {% endfor %}
        {% block body %}{% endblock %}
    </main>
    <footer class="container text-center text-muted my-5">StyleSlot - Colombia 2026</footer>
</body>
</html>
