<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · StyleSlot</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#2a0a0c,#171414)}
    .card{width:min(380px,calc(100% - 32px));background:#fff;border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{margin:0 0 20px;color:#2a0a0c;font-size:24px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-size:14px;color:#4b4042}.field input{width:100%;height:44px;border:1px solid #ddd0d1;border-radius:8px;padding:0 12px;font-size:15px}.error{background:#fde8e8;color:#9f1d2a;padding:10px;border-radius:8px;margin-bottom:14px}.btn{width:100%;height:44px;border:0;border-radius:8px;background:#2a0a0c;color:#fff;font-weight:700;cursor:pointer}.links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}.links a{color:#8b1e2e;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Iniciar sesión</h1>
    {% if error_login %}<div class="error">{{ error_login }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label for="usuario">Usuario o correo electrónico</label><input id="usuario" name="usuario" type="text" autocomplete="username" required></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <div class="links"><a href="{% url 'barberpro' %}">← Volver al sitio</a><a href="{% url 'admin:login' %}">Administración</a></div>
  </main>
</body>
</html>
